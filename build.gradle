import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

def localModDir = file("libs")
def optionalLocalMod = { String displayName, String pattern ->
    def matches = (localModDir.listFiles() ?: [] as File[])
        .findAll { it.isFile() && it.name ==~ pattern }
        .sort { it.name }
    if (matches.size() > 1) {
        throw new GradleException("Expected at most one ${displayName} JAR in libs/, found ${matches.size()}: ${matches*.name}")
    }
    matches ? matches[0] : null
}

def modMenuJar = optionalLocalMod(
    "Mod Menu",
    /(?i)^(?:\[[^\]]+\] )?modmenu-.*\.jar$/
)
def modMenuAvailable = modMenuJar != null

if (!modMenuAvailable) {
    sourceSets.main.java.exclude("com/murphypotato/simmctoolset/client/ToolSetModMenuIntegration.java")
    sourceSets.test.java.exclude("com/murphypotato/simmctoolset/client/ToolSetModMenuIntegrationTest.java")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "com.google.code.gson:gson:2.11.0"

    if (modMenuJar != null) {
        modCompileOnly files(modMenuJar)
        modLocalRuntime files(modMenuJar)
    }

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "org.junit.platform:junit-platform-launcher:1.11.4"
}

processResources {
    inputs.property "version", project.version
    inputs.property "modMenuAvailable", modMenuAvailable
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    doLast {
        if (!modMenuAvailable) {
            def metadataFile = new File(destinationDir, "fabric.mod.json")
            def metadata = new JsonSlurper().parse(metadataFile)
            if (metadata.entrypoints instanceof Map) {
                metadata.entrypoints.remove("modmenu")
            }
            metadataFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(metadata)) + System.lineSeparator()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
}

tasks.register("verifyUnitTests", JavaExec) {
    group = "verification"
    description = "Runs JUnit through the platform launcher without Gradle's broken local test worker."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.murphypotato.simmctoolset.UnitTestMain"
}

tasks.named("check") {
    dependsOn tasks.named("verifyUnitTests")
}

// Test-only mod and isolated game directory; never part of the distributable.
if (providers.gradleProperty("clientSmoke").isPresent()) {
    fabricApi.configureTests {
        createSourceSet = true
        modId = "simmc_tool_set_gametest"
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
    }
    loom.runs.named("clientGameTest") {
        runDir "run/client-gametest"
    }
}

tasks.withType(Jar).configureEach {
    from("LICENSE") {
        rename { "LICENSE_simmc-tool-set" }
    }
    from("THIRD_PARTY_NOTICES.md")
}
